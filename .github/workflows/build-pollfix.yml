name: Build PollFix

on:
  push:
    paths:
      - '.github/workflows/build-pollfix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /platform:anycpu /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /win32manifest:app.manifest /out:Audient-iD-4.4.2-PollFix.exe AudientPollFix.cs

      - name: Keep only the executable
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm AudientPollFix.cs app.manifest .github/workflows/build-pollfix.yml
          git add Audient-iD-4.4.2-PollFix.exe
          git commit -m "Publish Audient iD 4.4.2 PollFix"
          git push
